# single source of truth

# ---------- Reproducibility ----------
seed = 42

# ---------- Data subsetting ----------
n_prompts = 5000                      # total # of prompts, subsetted from RouterBench
split = [0.6, 0.2, 0.2]               # train / val / test, stratified by task

# ---------- Carbon cost inputs ----------
# carbon_cost = (Wh per query / 1000) kWh * grid_intensity (kg/kWh) / 1000 (kg -> t) * carbon_price ($/t)
grid_intensity = 0.308                 # kg CO2 per kWh, ISO-NE, source: Electricity Maps, 2025 
carbon_price = 41.49                    # $ per metric ton CO2, source: RGGI auction results

# ---------- Model Energy Inputs ----------
[energy_wh_per_1k_queries]    # AI Energy Score, Text Generation
"mistralai/mistral-7b-chat"   = 19.13   # source: Mistral-7B-v0.1
"mistralai/mixtral-8x7b-chat" = 615.39   # source: Mixtral-8x7B
"zero-one-ai/Yi-34B-Chat"     = 56.08   # source: Yi-1.5-34B
"meta/llama-2-70b-chat"       = 1648.51   # source: Llama-2-70b-hf
"WizardLM/WizardLM-13B-V1.2"        = 26.10   # source: Llama-2-13b-hf

# ---------- Trade-off scenarios ----------
# reward = quality - dollar * dollar_cost - carbon * carbon_cost
# The first three weight both costs equally; carbon_first weights only carbon.
[lambdas.quality_first]                # small: quality dominates
dollar = 100
carbon = 100

[lambdas.balanced]
dollar = 1000
carbon = 1000

[lambdas.efficiency_first]             # large: cost and carbon matter more
dollar = 3000
carbon = 3000

[lambdas.carbon_first]                 # ignore dollar cost, weight emissions heavily
dollar = 0
carbon = 100000

[lambdas.carbon_realistic]             # carbon priced near EPA's social cost of carbon (~$190-240/t)
dollar = 1000
carbon = 5000


# ---------- Policy tree search ----------
[tree]
max_depth = [2, 3, 4, 5]                 # tuned on validation data per scenario
minbucket = [5, 8, 10, 15, 20, 25]               # min leaf size, tuned on validation data

# ---------- Lambda sweep (sweep_lambda.jl) ----------
# Lambdas are fixed inputs, not tuned. For each one the tree's depth/minbucket are still tuned on val.
[sweep]
joint = [10, 30, 100, 300, 1000, 2000, 3000, 5000, 10000, 30000]       # lambda_dollar = lambda_carbon
carbon_only = [1000, 3000, 10000, 30000, 100000, 300000, 1000000]      # lambda_dollar = 0


# ---------- Model lookup table ----------